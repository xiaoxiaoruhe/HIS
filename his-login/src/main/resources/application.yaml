server:
  port: ${sp.login}
  servlet:
    # 设置上下文路径
    context-path: /login
spring:
  application:
    name: ${sn.login}
  cloud:
    sentinel:
      transport:
        # 控制台地址
        dashboard: ${sentinel.dashboard}
        port: 8720
      eager: true

# 开启sentinel声明式服务熔断
feign:
  sentinel:
    enabled: true
