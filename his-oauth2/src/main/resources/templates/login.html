<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>登录 - 01星球</title>
    <link rel="stylesheet" th:href="@{/css/login.css}"/>
</head>
<body>
<div class="login-card">
    <div class="logo">
        <!-- 01星球 Logo 占位符，可替换为你的真实 SVG -->
        <svg viewBox="0 0 75 75" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="37.5" cy="37.5" r="35" stroke="#1a73e8" stroke-width="3" fill="white"/>
            <text x="37.5" y="45" text-anchor="middle" fill="#1a73e8" font-size="24" font-weight="bold" dy=".3em">01
            </text>
        </svg>
    </div>
    <h1>登录您的账号</h1>
    <div class="subtitle">使用您的 01星球 账号继续</div>
    <!-- 显示错误信息（如果有） -->
    <div th:if="${param.error}" class="error-message">
        用户名或密码错误，请重试。
    </div>
    <div th:if="${param.logout}" class="error-message"
         style="background:#e8f0fe; color:#1a73e8; border-left-color:#1a73e8;">
        您已成功登出。
    </div>
    <form th:action="@{/login}" method="post">
        <div class="input-group">
            <label for="username">账号</label>
            <input type="text" id="username" name="username" placeholder="请输入账号" autofocus required>
        </div>
        <div class="input-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" placeholder="请输入密码" required>
        </div>
        <input type="hidden" name="client_id" th:value="${client_id}"/>
        <button type="submit">登录</button>
    </form>
</div>
</body>
</html>
